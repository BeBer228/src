plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

import org.gradle.jvm.toolchain.JavaLanguageVersion

version = '1.0.0'
group = 'releon.ru'

//def localBuildRoot = System.getenv("LOCALAPPDATA")
//if (localBuildRoot != null && !localBuildRoot.isBlank()) {
//  layout.buildDirectory = file("${localBuildRoot}/Releon/gradle-build")
//}

repositories {
	// Add repositories to retrieve artifacts from in here.
	maven { url = "https://maven.maxhenkel.de/repository/public" }
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "de.maxhenkel.voicechat:voicechat-api:2.6.20"
	modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-1.21.11-2.6.22"
	modRuntimeOnly "de.maxhenkel.voicechat:voicechat-api:2.6.20:fabric-stub"
	modImplementation "maven.modrinth:sodium:mc1.21.11-0.8.12-fabric"
	modImplementation "maven.modrinth:iris:1.10.7+1.21.11-fabric"
	implementation "org.anarres:jcpp:1.4.14"
	implementation "io.github.douira:glsl-transformer:3.0.0-pre3"
	implementation "org.antlr:antlr4-runtime:4.13.1"
}

loom {
	runs {
		client {
			programArgs "--username", "Bertylk"
		}
	}
}

processResources {
	def resourceProperties = [
			version             : project.version,
			minecraft_dependency: project.minecraft_version
	]
	inputs.properties(resourceProperties)

	filesMatching("fabric.mod.json") {
		expand resourceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
	doFirst {
		def metadata = javaLauncher.get().metadata
		if (metadata.vendor.toString().toLowerCase(Locale.ROOT).contains('jetbrains')) {
			jvmArgs('-XX:+AllowEnhancedClassRedefinition')
		}
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}