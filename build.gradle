plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

import org.gradle.jvm.toolchain.JavaLanguageVersion

version = '1.1.0'
group = 'releon.ru'

//def localBuildRoot = System.getenv("LOCALAPPDATA")
//if (localBuildRoot != null && !localBuildRoot.isBlank()) {
//  layout.buildDirectory = file("${localBuildRoot}/Releon/gradle-build")
//}

repositories {
	// Add repositories to retrieve artifacts from in here.
	maven { url = "https://maven.maxhenkel.de/repository/public" }
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "de.maxhenkel.voicechat:voicechat-api:2.6.20"
	modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-1.21.11-2.6.22"
	modRuntimeOnly "de.maxhenkel.voicechat:voicechat-api:2.6.20:fabric-stub"
	modImplementation "maven.modrinth:sodium:mc1.21.11-0.8.14-fabric"
	modImplementation "maven.modrinth:iris:1.10.8+1.21.11-fabric"

	// Performance stack for the development client (Minecraft 1.21.11 / Fabric).
	modRuntimeOnly "maven.modrinth:gvQqBUqZ:Ow7wA0kG" // Lithium 0.21.4
	modRuntimeOnly "maven.modrinth:5ZwdcRci:4EwhsTu7" // ImmediatelyFast 1.14.3
	modRuntimeOnly files('libs/Reflect-1.6.2.jar')
	modRuntimeOnly "maven.modrinth:NNAgCjsB:CTabrwB1" // Entity Culling 1.11.3
	modRuntimeOnly files('libs/TRansition-1.0.26-1.21.11-fabric-SNAPSHOT.jar')
	modRuntimeOnly files('libs/TRender-1.0.17-1.21.11-fabric-SNAPSHOT.jar')
	modRuntimeOnly "maven.modrinth:51shyZVL:wOzykoLV" // More Culling 1.6.2
	modRuntimeOnly files('libs/conditional-mixin-fabric-0.6.3.jar')
	modRuntimeOnly files('libs/mixinsquared-fabric-0.2.0.jar')
	modRuntimeOnly "maven.modrinth:9s6osm5g:xuX40TN5" // Cloth Config API 21.11.153
	modRuntimeOnly files('libs/basic-math-0.6.1.jar')
	modRuntimeOnly "maven.modrinth:uXXizFIs:Ii0gP3D8" // FerriteCore 8.2.0
	modRuntimeOnly "maven.modrinth:g96Z4WVZ:Q3Dusz2j" // BadOptimizations 2.4.1
	modRuntimeOnly "maven.modrinth:PtjYWJkn:efIKaD8Q" // Sodium Extra 0.9.5
	modRuntimeOnly "maven.modrinth:Bh37bMuy:ffpCc8nY" // Reese's Sodium Options 2.2.4
	implementation "org.anarres:jcpp:1.4.14"
	implementation "io.github.douira:glsl-transformer:3.0.0-pre3"
	implementation "org.antlr:antlr4-runtime:4.13.1"
}

loom {
	runs {
		client {
			programArgs "--username", "Bertylk"
		}
	}
}

processResources {
	def resourceProperties = [
			version             : project.version,
			minecraft_dependency: project.minecraft_version
	]
	inputs.properties(resourceProperties)

	filesMatching("fabric.mod.json") {
		expand resourceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
	doFirst {
		def metadata = javaLauncher.get().metadata
		if (metadata.vendor.toString().toLowerCase(Locale.ROOT).contains('jetbrains')) {
			jvmArgs('-XX:+AllowEnhancedClassRedefinition')
		}
	}
	jvmArgs('-Xms1G', '-Xmx4G', '-XX:+UseG1GC', '-XX:MaxGCPauseMillis=40',
			'-XX:+ParallelRefProcEnabled', '-XX:+UseStringDeduplication')
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
